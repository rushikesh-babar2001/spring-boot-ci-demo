name: Docker Build -> Push to ECR -> Deploy to EC2

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build Spring Boot application
      - name: Build Spring Boot application
        run: ./mvnw clean package -DskipTests

      # 4. Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239711842152:role/GitHubActionsECRRole
          aws-region: ap-south-1

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build and push Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: 239711842152.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: spring-boot-app
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 7. Deploy Docker container to EC2
      - name: Deploy to EC2 via SSM
        env:
          AWS_REGION: ap-south-1
          EC2_INSTANCE_ID: i-0f1a6b49f564bf598

          ECR_REGISTRY: 239711842152.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: spring-boot-app
          IMAGE_TAG: ${{ github.sha }}

          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\",
              \"docker stop spring-boot-container || true\",
              \"docker rm spring-boot-container || true\",
              \"docker run -d --restart unless-stopped -p 8080:8080 --name spring-boot-container -e DB_HOST='$DB_HOST' -e DB_NAME='$DB_NAME' -e DB_USERNAME='$DB_USERNAME' -e DB_PASSWORD='$DB_PASSWORD' $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment to finish
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          # Display deployment result
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
